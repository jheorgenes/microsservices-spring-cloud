server:
  port: 8000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  # Define como esta instância será anunciada no Eureka.
  # Quando true, o Eureka Client prefere anunciar o endereço IP
  # da máquina em vez do hostname.
  instance:
    prefer-ip-address: true
spring:
  application:
    name: exchange-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exchange_service
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
# Configuração para o Zipkin
management:
  tracing:
    sampling:
      probability: 1.0
zipkin:
  base-url: ${SPRING_ZIPKIN_BASEURL:http://localhost:9411}
# Alterando o caminho de acesso ao swagger
springdoc:
  api-docs:
    path: /exchange-service/v3/api-docs
  swagger-ui:
    url: /exchange-service/v3/api-docs
  # Força o servers do API Gateway corresponder a entrada da API Gateway
  override-server-url: true