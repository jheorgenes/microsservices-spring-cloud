services:
  zipkin-server:
    image: openzipkin/zipkin:3.5.1
    ports:
      - 9411:9411
    restart: always
    networks:
      - erudio-network

# jheorgenes/naming-server:0.0.1-SNAPSHOT
  naming-server:
    image: jheorgenes/naming-server:0.0.1-SNAPSHOT
    environment:
      SPRING_ZIPKIN_BASEURL: http://zipkin-server:9411
    restart: always
    depends_on:
      - zipkin-server
    ports:
      - 8761:8761
    networks:
      - erudio-network

# jheorgenes/api-gateway:0.0.1-SNAPSHOT
  api-gateway:
    image: jheorgenes/api-gateway:0.0.1-SNAPSHOT
    restart: always
    depends_on:
      - zipkin-server
      - naming-server
    environment:
      SPRING_ZIPKIN_BASEURL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
    ports:
      - 8765:8765
    networks:
      - erudio-network

  exchange-db:
    image: mysql:9.3.0
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: "d3IwLSV0Ny3ZpLWTNT2QrJNsb5rmzdH7"
      MYSQL_DATABASE: exchange_service
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - 3308:3306 # 3308 no host -> 3306 no container
    networks:
      - erudio-network

  book-db:
    image: mysql:9.3.0
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: "5ov3qqkHkTbfo4b4Y5ivRrYvoVc5YzHi"
      MYSQL_DATABASE: book_service
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
    healthcheck:
      test: [ 'CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"' ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - 3310:3306 # 3310 no host -> 3306 no container
    networks:
      - erudio-network

  exchange-service:
    image: jheorgenes/exchange-service
    pull_policy: build
    restart: always
    build:
      context: ./exchange-service
      dockerfile: Dockerfile
    environment:
      TZ: America/Sao_Paulo
      SPRING_ZIPKIN_BASEURL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://exchange-db:3306/exchange_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2
      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      zipkin-server:
        condition: service_started
      naming-server:
        condition: service_started
      exchange-db:
        condition: service_healthy
    ports:
      - 8000:8000
    networks:
      - erudio-network


  book-service:
    image: jheorgenes/book-service
    pull_policy: build
    restart: always
    build:
      context: ./book-service
      dockerfile: Dockerfile
    environment:
      TZ: America/Sao_Paulo
      SPRING_ZIPKIN_BASEURL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://book-db:3306/book_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2
      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      zipkin-server:
        condition: service_started
      naming-server:
        condition: service_started
      book-db:
        condition: service_healthy
    ports:
      - 8100:8100
    networks:
      - erudio-network

networks:
  erudio-network:
    name: erudio-network
    driver: bridge